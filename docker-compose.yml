services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: twinline_db
    ports:
      - "5432:5432"
    volumes:
      - twinline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASS: password
      DB_NAME: twinline_db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    environment:
      TWINLINE_API: http://backend:8000
    depends_on:
      - backend

volumes:
  twinline_pgdata:
